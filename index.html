<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú · Dr. Dou Social Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090b0b; --panel:#0f1413; --row:#141b1a; --line:#27332f; --text:#ecf2f0; --mute:#8d9d97;
  --accent:#00aa78; --accent-hi:#00d48f; --ink:#04100b;
  --y:#ffd600; --g:#28d66e; --b:#468cff; --m:#dc46dc; --r:#f53246;
  --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35;min-height:100vh}
body::before,body::after{content:"";display:block;height:10px;background:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-hi);outline-offset:2px}

.wrap{max-width:1320px;margin:0 auto;padding:22px 20px 40px}
header.top{display:grid;grid-template-columns:auto 1fr;gap:18px 28px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:22px}
.brand img{height:104px;width:auto;display:block}
.brand h1{margin:0;font-size:clamp(44px,7vw,70px);line-height:.95;font-weight:700;color:var(--accent);letter-spacing:-.01em}
.brand p{margin:6px 0 0;color:var(--mute);font-size:14px}
.tools{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:0}
.search{position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:16px;padding:13px 16px 13px 44px}
.search input::placeholder{color:var(--mute)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--mute);fill:none;stroke-width:2}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 11px;cursor:pointer;font-size:14px;min-height:40px}
.chip:hover{border-color:#43564f}
.chip[aria-pressed="true"]{background:#10231c;border-color:var(--accent-hi)}
.chip.clear{border-style:dashed;color:var(--mute);padding-left:14px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #ecf2f0;flex:none;display:inline-block}
.dot.Y{background:var(--y)}.dot.G{background:var(--g)}.dot.B{background:var(--b)}.dot.M{background:var(--m)}.dot.R{background:var(--r)}
.hint{margin:16px 0 0;color:var(--mute);font-size:14px}

main.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,370px),1fr));gap:22px;margin-top:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
section.card h2{margin:0;background:var(--accent);color:#fff;font-size:20px;font-weight:700;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
section.card h2 svg{width:22px;height:22px;fill:#fff}
ul.list{list-style:none;margin:0;padding:0}
ul.list li:nth-child(odd){background:var(--row)}
.item{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:13px 18px;min-height:48px;cursor:pointer;font-size:15px;font-weight:500;letter-spacing:.01em;transition:background .15s}
.item:hover{background:#12302a}
li:nth-child(odd) .item:hover{background:#12302a}
.item .dots{display:flex;gap:6px}
.coa-ico{width:22px;height:22px;stroke:var(--mute);fill:none;stroke-width:1.8;flex:none}
.item.has-coa .coa-ico{stroke:var(--accent-hi)}
.static{display:block;padding:13px 18px;font-size:15px;font-weight:500;min-height:48px;color:#d4dcd9}
li.hidden,section.card.hidden{display:none}
.empty{display:none;text-align:center;color:var(--mute);padding:50px 0}
.empty.show{display:block}

/* modal */
dialog{padding:0;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);width:min(920px,calc(100% - 28px));max-height:calc(100dvh - 28px);height:min(860px,calc(100dvh - 28px));overflow:hidden}
dialog[open]{display:flex;flex-direction:column;animation:pop .18s ease-out}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(2px)}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}.item{transition:none}}
.m-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.m-head .sec{color:var(--mute);font-size:13px;margin:0 0 3px}
.m-head h3{margin:0;font-size:clamp(20px,3.4vw,28px);line-height:1.15;font-weight:700}
.m-fx{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.m-fx span{display:inline-flex;align-items:center;gap:8px;background:var(--row);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;font-size:13px}
.x{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--row);cursor:pointer;display:grid;place-items:center}
.x:hover{border-color:var(--accent-hi)}
.x svg{width:20px;height:20px;stroke:var(--text);stroke-width:2.2;fill:none}
.m-body{flex:1;min-height:0;background:#060808;display:flex;align-items:stretch;justify-content:center;position:relative;overflow:auto;-webkit-overflow-scrolling:touch}
.m-body iframe{width:100%;height:100%;border:0;background:#fff}
.m-body img{display:block;width:100%;height:auto;max-width:none;margin:0 auto;background:#fff;align-self:flex-start}
.m-body.zoomed img{width:220%}
@media (min-width:761px){.m-body img{width:min(100%,900px)}.m-body.zoomed img{width:1500px;max-width:none}}
.state{margin:auto;max-width:420px;text-align:center;padding:30px 24px}
.state svg{width:54px;height:54px;stroke:var(--mute);fill:none;stroke-width:1.6;margin-bottom:12px}
.state h4{margin:0 0 6px;font-size:18px}
.state p{margin:0;color:var(--mute);font-size:14px}
.m-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--row);text-decoration:none;color:var(--text);font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{border-color:var(--accent-hi)}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.admin{display:none;font-size:13px;color:var(--mute)}
body.is-admin .admin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.slug{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--row);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--text)}

@media (max-width:760px){
  .wrap{padding:16px 14px 32px}
  header.top{grid-template-columns:1fr}
  .brand img{height:78px}
  dialog{width:100%;max-width:none;height:100dvh;max-height:none;border-radius:0;border:0}
  .m-foot .btns{width:100%}
  .m-foot .btn{flex:1}
}
</style>
</head>

  ["ULTRAGUAVA 70µ WPFF","G"],["BLUE DREAM FULL SPEC WPFF","G"],["GRAPE GAS 90µ WPFF COLD CURE","R"]]},
 { col:3, id:"rosin", title:"Rosin", items:[
  ["CHEM","M"],["RAINBOW BELTS","M"],["STRAWBERRY GUAVA","M"]]}
];

/* ================== LÓGICA ================== */
const $ = s => document.querySelector(s);
const slug = n => n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const ICON_DOC = '<svg class="coa-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>';
const CROSS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>';
const isAdmin = new URLSearchParams(location.search).has("admin");
if (isAdmin) document.body.classList.add("is-admin");

const state = { q:"", fx:new Set() };
const products = [];     // {name, slug, sec, fx, noCoa, el, li}

/* chips */
const chips = $("#chips");
Object.entries(EFFECTS).forEach(([k,label])=>{
  const b=document.createElement("button");
  b.className="chip"; b.type="button"; b.setAttribute("aria-pressed","false"); b.dataset.k=k;
  b.innerHTML=`<span class="dot ${k}"></span>${label}`;
  b.onclick=()=>{ state.fx.has(k)?state.fx.delete(k):state.fx.add(k); b.setAttribute("aria-pressed",state.fx.has(k)); apply(); };
  chips.appendChild(b);
});
const clear=document.createElement("button");
clear.className="chip clear"; clear.type="button"; clear.textContent="Quitar filtros"; clear.hidden=true;
clear.onclick=()=>{ state.fx.clear(); state.q=""; $("#q").value=""; chips.querySelectorAll(".chip[data-k]").forEach(c=>c.setAttribute("aria-pressed","false")); apply(); };
chips.appendChild(clear);
$("#q").addEventListener("input",e=>{ state.q=e.target.value; apply(); });

/* render */
const grid=$("#grid");
const cols=[1,2,3].map(()=>{const c=document.createElement("div");c.className="col";grid.appendChild(c);return c;});
MENU.forEach(sec=>{
  const card=document.createElement("section"); card.className="card"; card.id=sec.id;
  card.innerHTML=`<h2>${sec.title}${CROSS}</h2>`;
  const ul=document.createElement("ul"); ul.className="list"; card.appendChild(ul);
  sec.items.forEach(([name,fx])=>{
    const li=document.createElement("li");
    const p={name,slug:slug(name),sec:sec.title,fx:fx.split("").filter(Boolean),noCoa:!!sec.noCoa,li,card};
    if(sec.noCoa){
      li.innerHTML=`<span class="static">${name}</span>`;
    } else {
      const b=document.createElement("button"); b.type="button"; b.className="item";
      b.setAttribute("aria-label",`${name}: ver COA`);
      b.innerHTML=`<span>${name}</span><span class="dots">${p.fx.map(k=>`<span class="dot ${k}" title="${EFFECTS[k]}"></span>`).join("")}</span>${ICON_DOC}`;
      b.onclick=()=>openCoa(p);
      p.el=b; li.appendChild(b);
    }
    ul.appendChild(li); products.push(p);
  });
  cols[sec.col-1].appendChild(card);
});

function apply(){
  const q=slug(state.q).replace(/-/g," ");
  let shown=0;
  products.forEach(p=>{
    const okQ=!q || p.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().includes(q);
    const okF=!state.fx.size || p.fx.some(k=>state.fx.has(k));
    const ok=okQ&&okF; p.li.classList.toggle("hidden",!ok); if(ok) shown++;
  });
  document.querySelectorAll("section.card").forEach(c=>{
    c.classList.toggle("hidden",!c.querySelector("li:not(.hidden)"));
  });
  $("#empty").classList.toggle("show",shown===0);
  clear.hidden=!(state.fx.size||state.q);
}

/* COA */
function coaUrl(p){ return COAS[p.slug] || null; }
function hasCoa(p){ return !!(EMBED[p.slug] || COAS[p.slug]); }
function refreshIcons(){ products.forEach(p=>{ if(p.el) p.el.classList.toggle("has-coa",hasCoa(p)); }); }
fetch(CONFIG.manifest).then(r=>r.ok?r.json():{}).then(j=>{ Object.assign(COAS,j); refreshIcons(); }).catch(()=>{});
refreshIcons();

const dlg=$("#coaDialog"), body=$("#mBody"), openBtn=$("#mOpen"), downBtn=$("#mDown"), zoomBtn=$("#mZoom");
let lastFocus=null, current=null;
function altPath(u){ return u.startsWith("coa/")? u.slice(4) : "coa/"+u; }
function safeHash(h){ try{ history.replaceState(null,"",h); }catch(e){} }
function openDialog(){ if(dlg.open) return; try{ dlg.showModal(); }catch(e){ dlg.setAttribute("open",""); } }
const blobCache={};
function dataToBlobUrl(slug){
  if(blobCache[slug]) return blobCache[slug];
  if(!EMBED[slug].startsWith("data:")) return EMBED[slug];
  const raw=atob(EMBED[slug].split(",")[1]); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return blobCache[slug]=URL.createObjectURL(new Blob([arr],{type:"image/jpeg"}));
}
function setLinks(openUrl,downUrl,downName,downLabel){
  const set=(a,url)=>{ a.setAttribute("aria-disabled",url?"false":"true"); if(url) a.href=url; else a.removeAttribute("href"); };
  set(openBtn,openUrl); set(downBtn,downUrl);
  if(downName) downBtn.setAttribute("download",downName); else downBtn.removeAttribute("download");
  downBtn.textContent=downLabel||"Descargar";
}
function stateView(title,text){
  body.classList.remove("zoomed"); zoomBtn.hidden=true;
  body.innerHTML=`<div class="state"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6"/></svg><h4>${title}</h4><p>${text}</p></div>`;
  setLinks(null,null);
}
function isImg(u){ return /\.(png|jpe?g|webp|gif)(\?|#|$)/i.test(u)||u.startsWith("blob:")||u.startsWith("data:image"); }
function show(url,asImage){
  body.classList.remove("zoomed"); body.scrollTop=0; body.innerHTML="";
  if(asImage||isImg(url)){
    const i=document.createElement("img"); i.alt="COA"; let tried=false;
    i.onerror=()=>{ if(!tried && !/^(data|blob):/.test(url)){ tried=true; i.src=altPath(url); } else stateView("No se pudo mostrar la imagen","Prueba a abrirla en una pestaña nueva."); };
    i.onload=()=>{ if(!/^(data|blob):/.test(i.src) && openBtn.getAttribute("aria-disabled")==="false") openBtn.href=i.src; };
    i.src=url; body.appendChild(i);
    zoomBtn.hidden=false; zoomBtn.textContent="Ampliar";
  } else {
    zoomBtn.hidden=true;
    const f=document.createElement("iframe"); f.title="COA"; f.src=url; body.appendChild(f);
  }
}
zoomBtn.onclick=()=>{ const z=body.classList.toggle("zoomed"); zoomBtn.textContent=z?"Reducir":"Ampliar"; };

async function openCoa(p){
  try{ await openCoaInner(p); }catch(e){ try{ openDialog(); }catch(_){} stateView('No se pudo abrir el COA', String(e&&e.message||e)); }
}
async function openCoaInner(p){
  lastFocus=document.activeElement; current=p;
  $("#mSec").textContent=p.sec; $("#mTitle").textContent=p.name; $("#mSlug").textContent=p.slug+CONFIG.extension;
  $("#mFx").innerHTML=p.fx.map(k=>`<span><i class="dot ${k}"></i>${EFFECTS[k]}</span>`).join("");
  $("#mFx").hidden=!p.fx.length;
  openDialog();
  safeHash("#"+p.slug);
  const pdf=COAS[p.slug] || (CONFIG.folder+p.slug+CONFIG.extension);
  if(p.__obj){
    show(p.__obj,p.__objImg); setLinks(p.__obj,p.__obj,p.slug+(p.__objImg?".jpg":".pdf"),"Descargar");
  } else if(EMBED[p.slug]){
    show(EMBED[p.slug],true);
    const bu=dataToBlobUrl(p.slug);
    setLinks(bu,bu,p.slug+"-coa.jpg","Descargar imagen");
    (async()=>{ for(const u of [pdf,altPath(pdf)]){ try{ const r=await fetch(u,{method:"HEAD"}); if(r.ok){ if(current===p) setLinks(bu,u,p.slug+".pdf","Descargar PDF"); return; } }catch(e){} } })();
  } else {
    stateView("Cargando COA…","");
    let url=COAS[p.slug]||null;
    if(!url){ try{ const r=await fetch(pdf,{method:"HEAD"}); if(r.ok) url=pdf; }catch(e){} }
    if(current!==p) return;
    if(url){ show(url,false); setLinks(url,url,null,"Descargar"); }
    else stateView("COA no disponible","Todavía no hay un análisis publicado para esta variedad.");
  }
  $("#mFile").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const u=URL.createObjectURL(f); p.__obj=u; p.__objImg=f.type.startsWith("image/"); show(u,p.__objImg); setLinks(u,u,null,"Descargar"); e.target.value="";
  };
}
function closeDlg(){ if(dlg.open) dlg.close(); }
$("#mClose").onclick=closeDlg;
dlg.addEventListener("click",e=>{ if(e.target===dlg) closeDlg(); });
dlg.addEventListener("close",()=>{ safeHash(location.pathname+location.search); body.innerHTML=""; if(lastFocus&&lastFocus.focus) lastFocus.focus(); });

/* enlace directo: página#og-kush-pops abre su COA (útil para códigos QR) */
const h=decodeURIComponent(location.hash.slice(1));
if(h){ const p=products.find(x=>x.slug===h && !x.noCoa); if(p) openCoa(p); }
</script>
</body>
</html>
